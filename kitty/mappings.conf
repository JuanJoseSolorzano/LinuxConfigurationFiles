map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+h neighboring_window left
map ctrl+alt+l neighboring_window right

map ctrl+shift+j resize_window shorter
map ctrl+shift+k resize_window taller
map ctrl+shift+h resize_window wider
map ctrl+shift+l resize_window narrower
map ctrl+home resize_window reset

map alt+left previous_tab
map alt+right next_tab

map ctrl+shift+space next_layout
map ctrl+alt+z toggle_layout stack
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd

repaint_delay 10
input_delay 3
sync_to monitor yes
tab_bar_style powerline
# Tab bar settings
tab_bar_edge bottom                    # Show tabs at bottom
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0

# Tab bar style (can be: fade, sliver, or custom)
# tab_bar_style fade                   # Classic look
# tab_bar_style sliver                # Minimal look

# Tab bar colors
active_tab_foreground   #ebdbb2
active_tab_background   #504945
active_tab_font_style   bold-italic
inactive_tab_foreground #928374
inactive_tab_background #282828
inactive_tab_font_style normal
tab_bar_margin_color black

# Tab bar separator
tab_separator " ┇ "
#tab_powerline_style "" 

# Tab title format
tab_title_template "{title}"
# Or with index: tab_title_template "{index}: {title}"
# Or with all info: tab_title_template "{index}: {title} ({num_windows})"

# Always show tab bar
#tab_bar_min_tabs 1                     # Show even with 1 tab
# tab_bar_min_tabs 2                   # Hide with 1 tab, show with 2+

# Tab switching
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# Mouse click on tab bar to switch
mouse_map left click active_tab

# New tab location (after current or at end)
new_tab_location after_current


map ctrl+backspace send_text all \x17
